<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎵 SoundMaster Pro - Waaooo Kamal Audio Editor</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .studio-container {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 30px;
            box-shadow: 0 30px 60px rgba(0,0,0,0.3);
            padding: 40px;
            width: 100%;
            max-width: 1200px;
            animation: slideIn 0.5s ease-out;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(-50px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .header h1 {
            font-size: 3rem;
            background: linear-gradient(45deg, #FF6B6B, #4ECDC4);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 10px;
            animation: rainbow 3s infinite;
        }

        @keyframes rainbow {
            0% { filter: hue-rotate(0deg); }
            100% { filter: hue-rotate(360deg); }
        }

        .header p {
            color: #666;
            font-size: 1.2rem;
        }

        .upload-area {
            border: 3px dashed #764ba2;
            border-radius: 20px;
            padding: 40px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            background: #f8f9ff;
            margin-bottom: 30px;
        }

        .upload-area:hover {
            border-color: #4ECDC4;
            background: #f0f4ff;
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(102, 126, 234, 0.3);
        }

        .upload-area.dragover {
            border-color: #FF6B6B;
            background: #fff0f0;
            transform: scale(1.02);
        }

        .upload-icon {
            font-size: 4rem;
            margin-bottom: 20px;
            animation: bounce 2s infinite;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-20px); }
        }

        .waveform-container {
            background: #2d2d2d;
            border-radius: 15px;
            padding: 20px;
            margin: 20px 0;
            box-shadow: inset 0 4px 6px rgba(0,0,0,0.3);
        }

        #waveform {
            width: 100%;
            height: 200px;
            background: #1a1a1a;
            border-radius: 10px;
            cursor: pointer;
        }

        .controls-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin: 20px 0;
        }

        .control-card {
            background: linear-gradient(145deg, #ffffff, #f0f0f0);
            border-radius: 20px;
            padding: 20px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            transition: all 0.3s ease;
        }

        .control-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(0,0,0,0.2);
        }

        .control-card h3 {
            color: #764ba2;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 10px;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            gap: 5px;
        }

        .btn-primary {
            background: linear-gradient(45deg, #667eea, #764ba2);
            color: white;
        }

        .btn-success {
            background: linear-gradient(45deg, #11998e, #38ef7d);
            color: white;
        }

        .btn-danger {
            background: linear-gradient(45deg, #eb3349, #f45c43);
            color: white;
        }

        .btn-warning {
            background: linear-gradient(45deg, #f5af19, #f12711);
            color: white;
        }

        .btn:hover {
            transform: scale(1.05);
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
        }

        .btn:active {
            transform: scale(0.95);
        }

        .slider-container {
            margin: 15px 0;
        }

        .slider-container label {
            display: block;
            color: #333;
            margin-bottom: 5px;
            font-weight: 500;
        }

        input[type="range"] {
            width: 100%;
            -webkit-appearance: none;
            height: 8px;
            background: linear-gradient(45deg, #667eea, #764ba2);
            border-radius: 5px;
            outline: none;
        }

        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 20px;
            height: 20px;
            background: white;
            border: 3px solid #764ba2;
            border-radius: 50%;
            cursor: pointer;
            box-shadow: 0 2px 5px rgba(0,0,0,0.3);
        }

        .time-display {
            text-align: center;
            font-size: 2rem;
            color: #4ECDC4;
            font-weight: bold;
            font-family: 'Courier New', monospace;
        }

        .effects-section {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }

        .effect-btn {
            padding: 10px;
            border: 2px solid #667eea;
            background: white;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .effect-btn.active {
            background: #667eea;
            color: white;
            transform: scale(1.05);
        }

        @media (max-width: 768px) {
            .studio-container {
                padding: 20px;
            }
            .header h1 {
                font-size: 2rem;
            }
            .controls-grid {
                grid-template-columns: 1fr;
            }
        }

        .confetti {
            position: fixed;
            pointer-events: none;
            animation: confettiFall 3s linear;
        }

        @keyframes confettiFall {
            to {
                transform: translateY(100vh) rotate(720deg);
                opacity: 0;
            }
        }
    </style>
</head>
<body>
    <div class="studio-container">
        <!-- Header -->
        <div class="header">
            <h1>🎵 SoundMaster Pro</h1>
            <p>✨ Waaooo Kamal! Itna Aasan Audio Editor ✨</p>
        </div>

        <!-- Upload Area -->
        <div class="upload-area" id="uploadArea">
            <div class="upload-icon">🎤</div>
            <h2>📂 Apni Audio Yahan Drop Karein</h2>
            <p>ya Click karein file select karne ke liye</p>
            <input type="file" id="audioInput" accept="audio/*" style="display: none;">
        </div>

        <!-- Waveform -->
        <div class="waveform-container" id="waveformContainer" style="display: none;">
            <canvas id="waveform"></canvas>
        </div>

        <!-- Time Display -->
        <div class="time-display" id="timeDisplay">00:00 / 00:00</div>

        <!-- Transport Controls -->
        <div style="text-align: center; margin: 20px 0;">
            <button class="btn btn-primary" onclick="skipBackward()">⏮️ -5s</button>
            <button class="btn btn-success" id="playPauseBtn">▶️ Play</button>
            <button class="btn btn-danger" onclick="stop()">⏹️ Stop</button>
            <button class="btn btn-primary" onclick="skipForward()">⏭️ +5s</button>
        </div>

        <!-- Controls Grid -->
        <div class="controls-grid">
            <!-- Volume Control -->
            <div class="control-card">
                <h3>🔊 Volume</h3>
                <div class="slider-container">
                    <label>Master Volume</label>
                    <input type="range" id="volumeSlider" min="0" max="200" value="100" onchange="setVolume()">
                    <span id="volumeValue">100%</span>
                </div>
            </div>

            <!-- Speed Control -->
            <div class="control-card">
                <h3>⚡ Speed</h3>
                <div class="slider-container">
                    <label>Playback Speed</label>
                    <input type="range" id="speedSlider" min="0.5" max="2" step="0.1" value="1" onchange="setSpeed()">
                    <span id="speedValue">1x</span>
                </div>
            </div>

            <!-- Pitch Control -->
            <div class="control-card">
                <h3>🎹 Pitch</h3>
                <div class="slider-container">
                    <label>Pitch Shift</label>
                    <input type="range" id="pitchSlider" min="-12" max="12" step="1" value="0" onchange="setPitch()">
                    <span id="pitchValue">0 semitones</span>
                </div>
            </div>

            <!-- Trim Control -->
            <div class="control-card">
                <h3>✂️ Trim</h3>
                <div class="slider-container">
                    <label>Start</label>
                    <input type="range" id="trimStart" min="0" max="100" value="0" onchange="updateTrim()">
                </div>
                <div class="slider-container">
                    <label>End</label>
                    <input type="range" id="trimEnd" min="0" max="100" value="100" onchange="updateTrim()">
                </div>
                <button class="btn btn-warning" onclick="applyTrim()">Apply Trim</button>
            </div>
        </div>

        <!-- Effects Section -->
        <div class="control-card">
            <h3>🎛️ Effects</h3>
            <div class="effects-section">
                <button class="effect-btn" onclick="toggleEffect('reverb')">🌟 Reverb</button>
                <button class="effect-btn" onclick="toggleEffect('delay')">🔄 Echo</button>
                <button class="effect-btn" onclick="toggleEffect('distortion')">⚡ Distortion</button>
                <button class="effect-btn" onclick="toggleEffect('lowpass')">🔽 Low Pass</button>
                <button class="effect-btn" onclick="toggleEffect('highpass')">🔼 High Pass</button>
            </div>
        </div>

        <!-- Action Buttons -->
        <div style="text-align: center; margin: 30px 0;">
            <button class="btn btn-danger" onclick="undo()">↩️ Undo</button>
            <button class="btn btn-success" onclick="redo()">↪️ Redo</button>
            <button class="btn btn-primary" onclick="downloadAudio('wav')">💾 Download WAV</button>
            <button class="btn btn-primary" onclick="downloadAudio('mp3')">💾 Download MP3</button>
        </div>
    </div>

    <script>
        // Audio Engine Setup
        let audioContext;
        let audioBuffer;
        let sourceNode;
        let gainNode;
        let playbackRate = 1;
        let isPlaying = false;
        let startTime = 0;
        let pauseTime = 0;
        let animationId;
        let history = [];
        let historyIndex = -1;
        let activeEffects = new Set();

        // Initialize Audio Context
        function initAudioContext() {
            if (!audioContext) {
                audioContext = new (window.AudioContext || window.webkitAudioContext)();
            }
        }

        // Drag & Drop Setup
        const uploadArea = document.getElementById('uploadArea');
        const audioInput = document.getElementById('audioInput');

        uploadArea.addEventListener('click', () => audioInput.click());

        uploadArea.addEventListener('dragover', (e) => {
            e.preventDefault();
            uploadArea.classList.add('dragover');
        });

        uploadArea.addEventListener('dragleave', () => {
            uploadArea.classList.remove('dragover');
        });

        uploadArea.addEventListener('drop', (e) => {
            e.preventDefault();
            uploadArea.classList.remove('dragover');
            const file = e.dataTransfer.files[0];
            if (file && file.type.startsWith('audio/')) {
                loadAudioFile(file);
            }
        });

        audioInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) {
                loadAudioFile(file);
            }
        });

        // Load Audio File
        async function loadAudioFile(file) {
            try {
                initAudioContext();
                const arrayBuffer = await file.arrayBuffer();
                audioBuffer = await audioContext.decodeAudioData(arrayBuffer);
                
                // Save initial state for undo
                saveHistory();
                
                // Show waveform
                document.getElementById('waveformContainer').style.display = 'block';
                drawWaveform();
                
                // Update trim sliders
                document.getElementById('trimStart').max = audioBuffer.duration;
                document.getElementById('trimEnd').max = audioBuffer.duration;
                document.getElementById('trimEnd').value = audioBuffer.duration;
                
                // Show celebration
                createConfetti();
                alert('🎉 Waaooo! Audio Load Ho Gayi!');
            } catch (error) {
                alert('❌ Error loading audio: ' + error.message);
            }
        }

        // Draw Waveform
        function drawWaveform() {
            const canvas = document.getElementById('waveform');
            const ctx = canvas.getContext('2d');
            
            canvas.width = canvas.offsetWidth;
            canvas.height = canvas.offsetHeight;
            
            const data = audioBuffer.getChannelData(0);
            const step = Math.ceil(data.length / canvas.width);
            const amp = canvas.height / 2;
            
            ctx.fillStyle = '#1a1a1a';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            ctx.beginPath();
            ctx.strokeStyle = 'linear-gradient(45deg, #FF6B6B, #4ECDC4)';
            ctx.lineWidth = 2;
            
            for (let i = 0; i < canvas.width; i++) {
                let min = 1.0;
                let max = -1.0;
                
                for (let j = 0; j < step; j++) {
                    const datum = data[(i * step) + j];
                    if (datum < min) min = datum;
                    if (datum > max) max = datum;
                }
                
                ctx.moveTo(i, (1 + min) * amp);
                ctx.lineTo(i, (1 + max) * amp);
            }
            
            ctx.stroke();
        }

        // Play/Pause
        document.getElementById('playPauseBtn').addEventListener('click', togglePlay);

        function togglePlay() {
            if (isPlaying) {
                pauseAudio();
            } else {
                playAudio();
            }
        }

        function playAudio() {
            if (!audioBuffer) {
                alert('😊 Pehle Audio Upload Karein!');
                return;
            }
            
            initAudioContext();
            
            if (audioContext.state === 'suspended') {
                audioContext.resume();
            }
            
            sourceNode = audioContext.createBufferSource();
            sourceNode.buffer = audioBuffer;
            
            // Create effects chain
            gainNode = audioContext.createGain();
            let lastNode = sourceNode;
            
            // Add active effects
            if (activeEffects.has('reverb')) {
                const reverb = createReverb();
                lastNode.connect(reverb);
                lastNode = reverb;
            }
            
            if (activeEffects.has('delay')) {
                const delay = audioContext.createDelay();
                delay.delayTime.value = 0.3;
                lastNode.connect(delay);
                delay.connect(gainNode);
                lastNode.connect(gainNode);
            }
            
            lastNode.connect(gainNode);
            gainNode.connect(audioContext.destination);
            
            // Apply settings
            gainNode.gain.value = document.getElementById('volumeSlider').value / 100;
            sourceNode.playbackRate.value = parseFloat(document.getElementById('speedSlider').value);
            
            const startTrim = parseFloat(document.getElementById('trimStart').value) || 0;
            const offset = pauseTime || startTrim;
            
            sourceNode.start(0, offset);
            startTime = audioContext.currentTime - offset;
            isPlaying = true;
            
            document.getElementById('playPauseBtn').innerHTML = '⏸️ Pause';
            updateTimeDisplay();
        }

        function pauseAudio() {
            if (sourceNode) {
                pauseTime = audioContext.currentTime - startTime;
                sourceNode.stop();
                sourceNode.disconnect();
            }
            isPlaying = false;
            document.getElementById('playPauseBtn').innerHTML = '▶️ Play';
            cancelAnimationFrame(animationId);
        }

        function stop() {
            if (sourceNode) {
                sourceNode.stop();
                sourceNode.disconnect();
            }
            isPlaying = false;
            pauseTime = 0;
            document.getElementById('playPauseBtn').innerHTML = '▶️ Play';
            cancelAnimationFrame(animationId);
            updateTimeDisplay();
        }

        function skipForward() {
            pauseTime = Math.min(audioBuffer.duration, (pauseTime || 0) + 5);
            if (isPlaying) {
                pauseAudio();
                playAudio();
            }
            updateTimeDisplay();
        }

        function skipBackward() {
            pauseTime = Math.max(0, (pauseTime || 0) - 5);
            if (isPlaying) {
                pauseAudio();
                playAudio();
            }
            updateTimeDisplay();
        }

        // Time Display
        function updateTimeDisplay() {
            const display = document.getElementById('timeDisplay');
            if (isPlaying && audioContext) {
                const currentTime = audioContext.currentTime - startTime;
                const duration = audioBuffer.duration;
                display.textContent = `${formatTime(currentTime)} / ${formatTime(duration)}`;
                animationId = requestAnimationFrame(updateTimeDisplay);
            } else {
                const duration = audioBuffer ? audioBuffer.duration : 0;
                display.textContent = `${formatTime(pauseTime || 0)} / ${formatTime(duration)}`;
            }
        }

        function formatTime(seconds) {
            const mins = Math.floor(seconds / 60);
            const secs = Math.floor(seconds % 60);
            return `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
        }

        // Volume Control
        function setVolume() {
            const volume = document.getElementById('volumeSlider').value;
            document.getElementById('volumeValue').textContent = volume + '%';
            if (gainNode) {
                gainNode.gain.value = volume / 100;
            }
        }

        // Speed Control
        function setSpeed() {
            const speed = document.getElementById('speedSlider').value;
            document.getElementById('speedValue').textContent = speed + 'x';
            if (sourceNode) {
                sourceNode.playbackRate.value = speed;
            }
        }

        // Pitch Control
        function setPitch() {
            const pitch = document.getElementById('pitchSlider').value;
            document.getElementById('pitchValue').textContent = pitch + ' semitones';
            // Pitch shifting would require more complex implementation
            alert('🎵 Pitch feature will be available in next update!');
        }

        // Trim Functions
        function updateTrim() {
            const start = parseFloat(document.getElementById('trimStart').value);
            const end = parseFloat(document.getElementById('trimEnd').value);
            
            if (start >= end) {
                document.getElementById('trimEnd').value = start + 0.1;
            }
        }

        function applyTrim() {
            if (!audioBuffer) return;
            
            saveHistory();
            
            const start = parseFloat(document.getElementById('trimStart').value);
            const end = parseFloat(document.getElementById('trimEnd').value);
            
            const startSample = Math.floor(start * audioBuffer.sampleRate);
            const endSample = Math.floor(end * audioBuffer.sampleRate);
            const newLength = endSample - startSample;
            
            const newBuffer = audioContext.createBuffer(
                audioBuffer.numberOfChannels,
                newLength,
                audioBuffer.sampleRate
            );
            
            for (let channel = 0; channel < audioBuffer.numberOfChannels; channel++) {
                const oldData = audioBuffer.getChannelData(channel);
                const newData = newBuffer.getChannelData(channel);
                for (let i = 0; i < newLength; i++) {
                    newData[i] = oldData[startSample + i];
                }
            }
            
            audioBuffer = newBuffer;
            drawWaveform();
            alert('✂️ Trim Applied Successfully!');
        }

        // Effects
        function toggleEffect(effect) {
            if (activeEffects.has(effect)) {
                activeEffects.delete(effect);
            } else {
                activeEffects.add(effect);
            }
            
            // Update button states
            const buttons = document.querySelectorAll('.effect-btn');
            buttons.forEach(btn => {
                const effectName = btn.textContent.toLowerCase();
                if (effectName.includes(effect)) {
                    btn.classList.toggle('active', activeEffects.has(effect));
                }
            });
        }

        function createReverb() {
            const convolver = audioContext.createConvolver();
            const rate = audioContext.sampleRate;
            const length = rate * 2;
            const impulse = audioContext.createBuffer(2, length, rate);
            
            for (let channel = 0; channel < 2; channel++) {
                const data = impulse.getChannelData(channel);
                for (let i = 0; i < length; i++) {
                    data[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / length, 2);
                }
            }
            
            convolver.buffer = impulse;
            return convolver;
        }

        // Undo/Redo
        function saveHistory() {
            if (!audioBuffer) return;
            
            // Remove future history
            history = history.slice(0, historyIndex + 1);
            
            // Save current state
            history.push({
                buffer: audioBuffer.getChannelData(0).slice(),
                sampleRate: audioBuffer.sampleRate,
                numberOfChannels: audioBuffer.numberOfChannels,
                duration: audioBuffer.duration
            });
            
            historyIndex++;
        }

        function undo() {
            if (historyIndex > 0) {
                historyIndex--;
                restoreFromHistory();
                alert('↩️ Undo Done!');
            } else {
                alert('No more undo steps!');
            }
        }

        function redo() {
            if (historyIndex < history.length - 1) {
                historyIndex++;
                restoreFromHistory();
                alert('↪️ Redo Done!');
            } else {
                alert('No more redo steps!');
            }
        }

        function restoreFromHistory() {
            const state = history[historyIndex];
            audioBuffer = audioContext.createBuffer(
                state.numberOfChannels,
                state.buffer.length,
                state.sampleRate
            );
            audioBuffer.getChannelData(0).set(state.buffer);
            drawWaveform();
        }

        // Download
        function downloadAudio(format) {
            if (!audioBuffer) {
                alert('😊 Pehle Audio Upload Karein!');
                return;
            }
            
            // For demo purposes, we'll create a downloadable version
            const wavData = audioBufferToWav(audioBuffer);
            const blob = new Blob([wavData], { type: 'audio/wav' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `edited_audio.${format}`;
            a.click();
            URL.revokeObjectURL(url);
            
            createConfetti();
            alert('🎉 Waaooo! Audio Download Ho Gayi!');
        }

        function audioBufferToWav(buffer) {
            const numChannels = buffer.numberOfChannels;
            const sampleRate = buffer.sampleRate;
            const format = 1; // PCM
            const bitDepth = 16;
            
            const bytesPerSample = bitDepth / 8;
            const blockAlign = numChannels * bytesPerSample;
            
            const data = buffer.getChannelData(0);
            const dataLength = data.length * bytesPerSample;
            const headerLength = 44;
            const totalLength = headerLength + dataLength;
            
            const arrayBuffer = new ArrayBuffer(totalLength);
            const view = new DataView(arrayBuffer);
            
            // WAV Header
            writeString(view, 0, 'RIFF');
            view.setUint32(4, totalLength - 8, true);
            writeString(view, 8, 'WAVE');
            writeString(view, 12, 'fmt ');
            view.setUint32(16, 16, true);
            view.setUint16(20, format, true);
            view.setUint16(22, numChannels, true);
            view.setUint32(24, sampleRate, true);
            view.setUint32(28, sampleRate * blockAlign, true);
            view.setUint16(32, blockAlign, true);
            view.setUint16(34, bitDepth, true);
            writeString(view, 36, 'data');
            view.setUint32(40, dataLength, true);
            
            // Write audio data
            let offset = 44;
            for (let i = 0; i < data.length; i++) {
                const sample = Math.max(-1, Math.min(1, data[i]));
                view.setInt16(offset, sample < 0 ? sample * 0x8000 : sample * 0x7FFF, true);
                offset += 2;
            }
            
            return arrayBuffer;
        }

        function writeString(view, offset, string) {
            for (let i = 0; i < string.length; i++) {
                view.setUint8(offset + i, string.charCodeAt(i));
            }
        }

        // Celebration Effects
        function createConfetti() {
            for (let i = 0; i < 50; i++) {
                setTimeout(() => {
                    const confetti = document.createElement('div');
                    confetti.className = 'confetti';
                    confetti.style.left = Math.random() * 100 + '%';
                    confetti.style.top = -10 + '%';
                    confetti.style.color = `hsl(${Math.random() * 360}, 100%, 50%)`;
                    confetti.style.fontSize = (Math.random() * 20 + 10) + 'px';
                    confetti.textContent = ['🎉', '✨', '🎵', '🌟', '💎'][Math.floor(Math.random() * 5)];
                    document.body.appendChild(confetti);
                    
                    setTimeout(() => confetti.remove(), 3000);
                }, i * 30);
            }
        }

        // Initialize
        window.addEventListener('resize', () => {
            if (audioBuffer) drawWaveform();
        });
    </script>
</body>
